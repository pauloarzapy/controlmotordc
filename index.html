<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Global IoT - Firebase Control Motor DC</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #11141a; color: #ffffff; margin-top: 40px; }
        .container { background-color: #1e222b; padding: 40px; border-radius: 20px; display: inline-block; box-shadow: 0 15px 30px rgba(0,0,0,0.5); border: 1px solid #2d3341; }
        h1 { color: #00bcd4; font-size: 2.2rem; margin-bottom: 5px; }
        .badge { font-size: 12px; background: #2d3341; padding: 4px 10px; border-radius: 10px; color: #a0aab8; }
        .btn { font-size: 20px; font-weight: bold; padding: 15px 40px; margin: 15px 10px; border: none; border-radius: 12px; cursor: pointer; color: white; transition: all 0.2s; }
        .btn-encender { background-color: #00b894; }
        .btn-parar { background-color: #d63031; }
        .monitor-box { margin: 25px auto; padding: 15px; width: 80%; border-radius: 10px; font-size: 22px; font-weight: bold; text-transform: uppercase; border: 2px solid #57606f; background-color: #2f3542; transition: all 0.3s ease; }
        .estado-quieto { color: #ced6e0; background-color: #2f3542; border-color: #57606f; }
        .estado-adelante { color: #ffffff; background-color: #00b894; border-color: #55efc4; box-shadow: 0 0 15px rgba(0, 184, 148, 0.4); }
        .estado-atras { color: #ffffff; background-color: #2980b9; border-color: #3498db; box-shadow: 0 0 15px rgba(41, 128, 185, 0.4); }
        #status { font-weight: bold; font-size: 14px; color: #00b894; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Control Direccional IoT</h1>
        <span class="badge">Servidor Seguro de Google Firebase</span>
        
        <div id="motorMonitor" class="monitor-box estado-quieto">Motor: DETENIDO</div>

        <button class="btn btn-encender" onclick="enviarComando('A')">🔼 ADELANTE</button>
        <button class="btn btn-parar" onclick="enviarComando('P')">🛑 PARAR</button>
        <button class="btn btn-encender" style="background-color: #2980b9;" onclick="openLink() " onclick="enviarComando('R')">🔽 ATRÁS</button>
        
        <div id="status">Red: Conectado a Google Cloud Server</div>
    </div>

    <script>
        // PEGA AQUÍ LA URL COMPLETA DE TU FIREBASE (Mantén el https:// y agrégale /comando.json al final)
        // Ejemplo: "https://firebaseio.com"
        const firebase_url = "https://control-motor-b04c1-default-rtdb.firebaseio.com/comando.json";

        function enviarComando(letra) {
            const monitor = document.getElementById('motorMonitor');
            
            // Actualizar la interfaz de forma inmediata en la web
            if (letra === 'A') {
                monitor.innerText = "Motor: ENVIANDO ADELANTE";
                monitor.className = "monitor-box estado-adelante";
            } else if (letra === 'R') {
                monitor.innerText = "Motor: ENVIANDO ATRÁS";
                monitor.className = "monitor-box estado-atras";
            } else if (letra === 'P') {
                monitor.innerText = "Motor: ENVIANDO PARAR";
                monitor.className = "monitor-box estado-quieto";
            }

            // Enviar el dato a Google usando un método web común (PUT) que nadie bloquea
            fetch(firebase_url, {
                method: 'PUT',
                body: JSON.stringify(letra)
            })
            .then(res => res.json())
            .then(data => {
                if (letra === 'A') monitor.innerText = "Motor: GIRANDO ADELANTE";
                if (letra === 'R') monitor.innerText = "Motor: GIRANDO ATRÁS";
                if (letra === 'P') monitor.innerText = "Motor: DETENIDO";
            })
            .catch(err => {
                alert("Error al conectar con Google Cloud.");
            });
        }
    </script>
</body>
</html>
