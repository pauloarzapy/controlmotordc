<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control IoT Multiseñal</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #11141a; color: #ffffff; margin-top: 15px; user-select: none; }
        .container { background-color: #1e222b; padding: 25px; border-radius: 20px; display: inline-block; box-shadow: 0 15px 30px rgba(0,0,0,0.5); border: 1px solid #2d3341; margin-bottom: 20px; }
        h1 { color: #ff9f43; font-size: 2rem; margin-bottom: 5px; }
        h2 { color: #00bcd4; font-size: 1.3rem; margin-top: 20px; border-bottom: 1px solid #2d3341; padding-bottom: 5px; }
        .badge { font-size: 12px; background: #2d3341; padding: 4px 10px; border-radius: 10px; color: #a0aab8; }
        
        /* Estilos de la cruceta */
        .grid-control { display: grid; grid-template-columns: 90px 90px 90px; grid-template-rows: 70px 70px 70px; gap: 12px; margin: 15px auto; width: 300px; justify-content: center; }
        .btn { font-size: 22px; font-weight: bold; border: none; border-radius: 15px; cursor: pointer; color: white; transition: all 0.1s; background-color: #2f3542; }
        .btn:active { transform: scale(0.95); }
        .btn-arriba { grid-column: 2; background-color: #1dd1a1; }
        .btn-izquierda { grid-column: 1; grid-row: 2; background-color: #3498db; }
        .btn-stop { grid-column: 2; grid-row: 2; background-color: #ff6b6b; font-size: 14px; }
        .btn-derecha { grid-column: 3; grid-row: 2; background-color: #3498db; }
        .btn-abajo { grid-column: 2; grid-row: 3; background-color: #1dd1a1; }
        
        /* Panel de interruptores de los 8 Relés */
        .grid-reles { display: grid; grid-template-columns: repeat(4, 70px); gap: 10px; justify-content: center; margin-top: 15px; }
        .btn-rele { font-size: 12px; font-weight: bold; padding: 12px 0; border: 2px solid #57606f; border-radius: 8px; background-color: #2f3542; color: #ced6e0; cursor: pointer; }
        .btn-rele.on { background-color: #eb4d4b; border-color: #ff7675; color: white; box-shadow: 0 0 8px rgba(235, 77, 75, 0.4); }
        
        .monitor-panel { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .monitor-box { padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 12px; background-color: #2f3542; border: 1px solid #57606f; text-transform: uppercase; }
        .activo-verde { background-color: #1dd1a1; color: #11141a; }
        .activo-azul { background-color: #3498db; color: #ffffff; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Control Maestro IoT</h1>
        <span class="badge">Doble Puente H + 8 Relés Integrados</span>
        
        <h2>🕹️ Control de Motores (Puentes H)</h2>
        <div class="grid-control">
            <button class="btn btn-arriba" onclick="cmdTraccion('A')">🔼</button>
            <button class="btn btn-izquierda" onclick="cmdDireccion('I')">◀️</button>
            <button class="btn btn-stop" onclick="FrenarTodo()">🛑</button>
            <button class="btn btn-derecha" onclick="cmdDireccion('D')">▶️</button>
            <button class="btn btn-abajo" onclick="cmdTraccion('R')">🔽</button>
        </div>

        <div class="monitor-panel">
            <div id="monTraccion" class="monitor-box">M2 (Tracción): Stop</div>
            <div id="monDireccion" class="monitor-box">M1 (Dirección): Recto</div>
        </div>

        <h2>🔌 Control de los 8 Relés Incorporados</h2>
        <div class="grid-reles">
            <button id="r1" class="btn-rele" onclick="toggleRele(0)">R1: OFF</button>
            <button id="r2" class="btn-rele" onclick="toggleRele(1)">R2: OFF</button>
            <button id="r3" class="btn-rele" onclick="toggleRele(2)">R3: OFF</button>
            <button id="r4" class="btn-rele" onclick="toggleRele(3)">R4: OFF</button>
            <button id="r5" class="btn-rele" onclick="toggleRele(4)">R5: OFF</button>
            <button id="r6" class="btn-rele" onclick="toggleRele(5)">R6: OFF</button>
            <button id="r7" class="btn-rele" onclick="toggleRele(6)">R7: OFF</button>
            <button id="r8" class="btn-rele" onclick="toggleRele(7)">R8: OFF</button>
        </div>
    </div>

    <script>
        // URLs completas vinculadas a tu base de datos real de Google
        const fb_traccion_url = "https://firebaseio.com";
        const fb_direccion_url = "https://firebaseio.com";
        const fb_reles_url = "https://firebaseio.com";

        // Arreglo nativo para almacenar el estado de los relés
        let estadoReles = [0, 0, 0, 0, 0, 0, 0, 0];

        function cmdTraccion(val) {
            const mon = document.getElementById('monTraccion');
            if (val === 'A') { mon.innerText = "M2: ADELANTE"; mon.className = "monitor-box activo-verde"; }
            else if (val === 'R') { mon.innerText = "M2: REVERSA"; mon.className = "monitor-box activo-verde"; }
            else { mon.innerText = "M2: STOP"; mon.className = "monitor-box"; }
            fetch(fb_traccion_url, { method: 'PUT', body: JSON.stringify(val) });
        }

        function cmdDireccion(val) {
            const mon = document.getElementById('monDireccion');
            if (val === 'I') { mon.innerText = "M1: IZQUIERDA"; mon.className = "monitor-box activo-azul"; }
            else if (val === 'D') { mon.innerText = "M1: DERECHA"; mon.className = "monitor-box activo-azul"; }
            else { mon.innerText = "M1: REPOSO"; mon.className = "monitor-box"; }
            fetch(fb_direccion_url, { method: 'PUT', body: JSON.stringify(val) });
        }

        function FrenarTodo() { cmdTraccion('P'); cmdDireccion('P'); }

        function toggleRele(index) {
            estadoReles[index] = estadoReles[index] === 0 ? 1 : 0;
            
            const btn = document.getElementById('r' + (index + 1));
            if (estadoReles[index] === 1) {
                btn.innerText = "R" + (index + 1) + ": ON";
                btn.className = "btn-rele on";
            } else {
                btn.innerText = "R" + (index + 1) + ": OFF";
                btn.className = "btn-rele";
            }

            // Corrección de sintaxis: .join en minúsculas para empaquetar la cadena
            let cadenaStr = estadoReles.join("");
            fetch(fb_reles_url, { method: 'PUT', body: JSON.stringify(cadenaStr) });
        }
    </script>
</body>
</html>
