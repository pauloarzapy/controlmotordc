<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Global IoT - Monitoreo de Limpiaparabrisas</title>
    <!-- Cargamos la librería oficial de MQTT sobre WebSockets de forma segura -->
    <script src="https://cloudflare.com" type="text/javascript"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #11141a; color: #ffffff; margin-top: 40px; }
        .container { background-color: #1e222b; padding: 40px; border-radius: 20px; display: inline-block; box-shadow: 0 15px 30px rgba(0,0,0,0.5); border: 1px solid #2d3341; }
        h1 { color: #00bcd4; font-size: 2.2rem; margin-bottom: 5px; }
        .badge { font-size: 12px; background: #2d3341; padding: 4px 10px; border-radius: 10px; color: #a0aab8; }
        .btn { font-size: 20px; font-weight: bold; padding: 15px 40px; margin: 15px 10px; border: none; border-radius: 12px; cursor: pointer; color: white; transition: all 0.2s; }
        .btn-encender { background-color: #00b894; }
        .btn-parar { background-color: #d63031; }
        .monitor-box { margin: 25px auto; padding: 15px; width: 80%; border-radius: 10px; font-size: 22px; font-weight: bold; text-transform: uppercase; border: 2px solid #57606f; background-color: #2f3542; transition: all 0.3s ease; }
        .estado-quieto { color: #ced6e0; background-color: #2f3542; border-color: #57606f; }
        .estado-adelante { color: #ffffff; background-color: #00b894; border-color: #55efc4; box-shadow: 0 0 15px rgba(0, 184, 148, 0.4); }
        .estado-atras { color: #ffffff; background-color: #2980b9; border-color: #3498db; box-shadow: 0 0 15px rgba(41, 128, 185, 0.4); }
        #status { font-weight: bold; font-size: 14px; color: #a0aab8; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Control y Monitoreo IoT</h1>
        <span class="badge">Feedback Seguro - Nube EMQX</span>
        
        <div id="motorMonitor" class="monitor-box estado-quieto">Motor: DETENIDO</div>

        <button class="btn btn-encender" onclick="publicarComando('A')">🔼 ADELANTE</button>
        <button class="btn btn-parar" onclick="publicarComando('P')">🛑 PARAR</button>
        <button class="btn btn-encender" style="background-color: #2980b9;" onclick="publicarComando('R')">🔽 ATRÁS</button>
        
        <div id="status">Red: Conectando a la nube de EMQX...</div>
    </div>

    <script>
        const brokerUrl = "wss://broker.emqx.io:8084/mqtt";
        const topicControl = "limpiaparabrisas/proyecto/control";
        const topicEstado = "limpiaparabrisas/proyecto/estado";
        
        // Conexión usando la librería estable global
        const client = mqtt.connect(brokerUrl, {
            clientId: "WebClient_" + Math.random().toString(16).substr(2, 8),
            clean: true,
            connectTimeout: 4000
        });

        client.on('connect', () => {
            document.getElementById('status').innerText = "Red: Conectado a la nube segura EMQX";
            document.getElementById('status').style.color = "#00b894";
            client.subscribe(topicEstado);
        });

        client.on('error', (err) => {
            console.error('Connection error: ', err);
            document.getElementById('status').innerText = "Red: Error de conexión.";
            document.getElementById('status').style.color = "#d63031";
        });

        client.on('close', () => {
            document.getElementById('status').innerText = "Red: Desconectado de la nube.";
            document.getElementById('status').style.color = "#d63031";
        });

        // Escucha las respuestas del ESP32
        client.on('message', (topic, message) => {
            if (topic === topicEstado) {
                const estado = message.toString().trim();
                const monitor = document.getElementById('motorMonitor');
                
                if (estado === "ADELANTE") {
                    monitor.innerText = "Motor: GIRANDO ADELANTE";
                    monitor.className = "monitor-box estado-adelante";
                } else if (estado === "ATRAS") {
                    monitor.innerText = "Motor: GIRANDO ATRÁS";
                    monitor.className = "monitor-box estado-atras";
                } else if (estado === "STOP") {
                    monitor.innerText = "Motor: DETENIDO";
                    monitor.className = "monitor-box estado-quieto";
                }
            }
        });

        // Publica la letra exacta al presionar un botón
        function publicarComando(letra) {
            if (client && client.connected) {
                client.publish(topicControl, letra, { qos: 0 });
                console.log("Comando enviado: " + letra);
            } else {
                alert("Aún no hay conexión con el servidor MQTT.");
            }
        }
    </script>
</body>
</html>
