<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTROL IoT de Paulo Arza de Paraguay y su re amix Google</title>
    <style>
        body { background-color: #121212; color: white; font-family: Arial, sans-serif; text-align: center; padding: 10px; user-select: none; -webkit-user-select: none; }
        h1 { color: #ff9800; margin-bottom: 2px; font-size: 24px; }
        h3 { color: #00bcd4; margin-top: 0; font-size: 16px; }
        .panel { border: 2px solid #2196f3; padding: 10px; border-radius: 10px; display: inline-block; margin-top: 5px; background: #1a1a1a; width: 90%; max-width: 340px; }
        .panel-reles { border: 2px solid #e91e63; }
        .switch-container { margin: 10px 0; font-size: 16px; }
        .grid-reles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
        .btn { font-size: 18px; font-weight: bold; border-radius: 6px; border: 2px solid white; cursor: pointer; height: 50px; }
        .btn-dir { background-color: #2196f3; color: white; width: 55px; }
        .btn-trac { background-color: #4caf50; color: black; width: 55px; }
        .btn-stop { background-color: #f44336; color: white; width: 100%; height: 45px; margin-top: 8px; }
        .btn-rele { background-color: #555555; color: white; font-size: 14px; height: 45px; }
        .btn-rele.activo { background-color: #e91e63; color: white; }
        .btn:active { opacity: 0.6; }
        #timer-label { font-size: 16px; color: #ffeb3b; font-weight: bold; margin-top: 8px; }
        #queue-label { font-size: 12px; color: #aaaaaa; }
        .seccion-titulo { font-size: 12px; color: #ffffff; text-align: left; margin: 2px 0 5px 5px; font-weight: bold; }
        #msg-error { color: #ff3333; font-weight: bold; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>CONTROL MAESTRO</h1>
    <h3>Ecosistema IoT para 2 motores dc con puente H externo y una placa de 8 reles ESP32</h3>
 
    <div id="msg-error">⚠️ FALTA EL TOKEN EN LA URL (?key=...)</div>

    <div class="switch-container">
        <label>
            <input type="checkbox" id="modo-pasos" onchange="cambiarModo()"> 
            <strong>ACTIVAR MODO POR PASOS</strong>
        </label>
    </div>

    <!-- PANEL DE MOTORES -->
    <div class="panel">
        <div class="seccion-titulo">SISTEMA DE MOTORES:</div>
        <div>
            <button class="btn btn-dir" id="btn-I" onmousedown="iniciarComando('direccion','I')" onmouseup="finalizarComando('direccion','I')" ontouchstart="iniciarComando('direccion','I')" ontouchend="finalizarComando('direccion','I')">I</button>
            <button class="btn btn-trac" id="btn-A" onmousedown="iniciarComando('traccion','A')" onmouseup="finalizarComando('traccion','A')" ontouchstart="iniciarComando('traccion','A')" ontouchend="finalizarComando('traccion','A')">A</button>
            <button class="btn btn-trac" id="btn-R" onmousedown="iniciarComando('traccion','R')" onmouseup="finalizarComando('traccion','R')" ontouchstart="iniciarComando('traccion','R')" ontouchend="finalizarComando('traccion','R')">R</button>
            <button class="btn btn-dir" id="btn-D" onmousedown="iniciarComando('direccion','D')" onmouseup="finalizarComando('direccion','D')" ontouchstart="iniciarComando('direccion','D')" ontouchend="finalizarComando('direccion','D')">D</button>
        </div>
        <button class="btn btn-stop" id="btn-P" onclick="enviarStopFuerte()">STOP GENERAL</button>
        <div id="timer-label">Tiempo: 0.00s</div>
        <div id="queue-label">Fila de espera: 0 comandos</div>
    </div>

    <br>

    <!-- PANEL DE LOS 8 RELÉS INTEGRADOS -->
    <div class="panel panel-reles">
        <div class="seccion-titulo">MÓDULO DE ACTUADORES RELÉ:</div>
        <div class="grid-reles">
            <button class="btn btn-rele" id="r0" onclick="conmutarRele(0)">R1</button>
            <button class="btn btn-rele" id="r1" onclick="conmutarRele(1)">R2</button>
            <button class="btn btn-rele" id="r2" onclick="conmutarRele(2)">R3</button>
            <button class="btn btn-rele" id="r3" onclick="conmutarRele(3)">R4</button>
            <button class="btn btn-rele" id="r4" onclick="conmutarRele(4)">R5</button>
            <button class="btn btn-rele" id="r5" onclick="conmutarRele(5)">R6</button>
            <button class="btn btn-rele" id="r6" onclick="conmutarRele(6)">R7</button>
            <button class="btn btn-rele" id="r7" onclick="conmutarRele(7)">R8</button>
        </div>
    </div>

    <script>
		const fb_url = "https://control-motor-b04c1-default-rtdb.firebaseio.com/";
        
        // 👉 EXTRACCIÓN AUTOMÁTICA DEL TOKEN DESDE LA URL (?key=...)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('key');

        let tiempoInicio = 0;
        let modoPasosActivo = false;
        let filaComandos = [];
        let procesandoFila = false;
        let comandoActivo = null;
        let estadoReles = ["0","0","0","0","0","0","0","0"];

        // Validar si el token fue ingresado correctamente en la barra
        if (!token) {
            document.getElementById("msg-error").style.display = "block";
        } else {
            // Cargar estado inicial de los relés desde Firebase al abrir la web
            fetch(`${fb_url}reles.json?auth=${token}`).then(r => r.json()).then(data => {
                if(data && data.length === 8) {
                    estadoReles = data.split("");
                    actualizarBotonesReles();
                }
            });
        }

        function cambiarModo() {
            if (!token) return;
            modoPasosActivo = document.getElementById("modo-pasos").checked;
            let modoStr = modoPasosActivo ? "pasos" : "continuo";
            fetch(`${fb_url}modo_operacion.json?auth=${token}`, { method: 'PUT', body: JSON.stringify(modoStr) });
            if(!modoPasosActivo) { filaComandos = []; actualizarInterfazFila(); }
        }

        function iniciarComando(nodo, valor) {
            if (!token || comandoActivo) return;
            comandoActivo = { nodo, valor };
            tiempoInicio = performance.now();
            if (!modoPasosActivo) enviarFBRapido(nodo, valor);
        }

        function finalizarComando(nodo, valor) {
            if (!token || !comandoActivo || comandoActivo.valor !== valor) return;
            let tiempoFin = performance.now();
            let duracionMs = Math.round(tiempoFin - tiempoInicio);
            comandoActivo = null;

            if (modoPasosActivo) {
                document.getElementById("timer-label").innerText = `Último toque: ${(duracionMs/1000).toFixed(2)}s`;
                filaComandos.push(`${valor}:${duracionMs}`);
                actualizarInterfazFila();
                procesarSiguienteEnFila();
            } else {
                enviarFBRapido(nodo, "P");
            }
        }

        function conmutarRele(idx) {
            if (!token) return;
            estadoReles[idx] = (estadoReles[idx] === "0") ? "1" : "0";
            actualizarBotonesReles();
            enviarFBRapido("reles", estadoReles.join(""));
        }

        function actualizarBotonesReles() {
            for(let i=0; i<8; i++) {
                let btn = document.getElementById(`r${i}`);
                if(estadoReles[i] === "1") btn.classList.add("activo");
                else btn.classList.remove("activo");
            }
        }

        function procesarSiguienteEnFila() {
            if (!token || procesandoFila || filaComandos.length === 0) return;
            procesandoFila = true;

            fetch(`${fb_url}comando_paso.json?auth=${token}`).then(res => res.json()).then(data => {
                if (data === "P") {
                    let siguiente = filaComandos.shift();
                    actualizarInterfazFila();
                    fetch(`${fb_url}comando_paso.json?auth=${token}`, { method: 'PUT', body: JSON.stringify(siguiente) })
                    .then(() => {
                        const intervalo = setInterval(() => {
                            fetch(`${fb_url}comando_paso.json?auth=${token}`).then(res => res.json()).then(data => {
                                if (data === "P") { clearInterval(intervalo); procesandoFila = false; procesarSiguienteEnFila(); }
                            });
                        }, 80);
                    });
                } else {
                    procesandoFila = false;
                    setTimeout(procesarSiguienteEnFila, 400);
                }
            });
        }

        function actualizarInterfazFila() {
            document.getElementById("queue-label").innerText = `Fila de espera: ${filaComandos.length} comandos`;
        }

        function enviarFBRapido(nodo, valor) {
            if (!token) return;
            fetch(`${fb_url}${nodo}.json?auth=${token}`, { method: 'PUT', body: JSON.stringify(valor) });
        }

        function enviarStopFuerte() {
            if (!token) return;
            filaComandos = []; actualizarInterfazFila();
            enviarFBRapido("comando_paso", "P");
            enviarFBRapido("traccion", "P");
            enviarFBRapido("direccion", "P");
            document.getElementById("timer-label").innerText = "STOP GENERAL ENVIADO";
        }
    </script>
</body>
</html>
