<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CONTROL IoT TRIPLE MODO - Paulo Arza de Asuncion - Paraguay y su archiamix Google</title>
        <style>
            body {
                background-color: #121212;
                color: white;
                font-family: Arial, sans-serif;
                text-align: center;
                padding: 10px;
                user-select: none;
                -webkit-user-select: none;
                touch-action: manipulation;
            }

            h1 {
                color: #ff9800;
                margin-bottom: 2px;
                font-size: 24px;
            }

            h3 {
                color: #00bcd4;
                margin-top: 0;
                font-size: 16px;
            }

            .panel {
                border: 2px solid #2196f3;
                padding: 10px;
                border-radius: 10px;
                display: inline-block;
                margin-top: 5px;
                background: #1a1a1a;
                width: 90%;
                max-width: 340px;
            }

            .panel-reles {
                border: 2px solid #444444;
            }

            .select-container {
                margin: 12px 0;
                font-size: 16px;
            }

            select {
                font-size: 14px;
                padding: 6px;
                background: #222;
                color: white;
                border: 2px solid #2196f3;
                border-radius: 4px;
                cursor: pointer;
            }

            .grid-reles {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
                margin-top: 8px;
            }

            .btn {
                font-size: 18px;
                font-weight: bold;
                border-radius: 6px;
                border: 2px solid white;
                cursor: pointer;
                height: 50px;
                touch-action: none;
                background-color: #333333;
                color: white;
                transition: all 0.1s ease;
            }

            .btn.activo-motor {
                background-color: #00bcd4 !important;
                color: black !important;
                border-color: #00bcd4 !important;
            }

            .btn-stop {
                background-color: #f44336;
                color: white;
                width: 100%;
                height: 45px;
                margin-top: 8px;
            }

            .btn-rele {
                background-color: #333333;
                color: white;
                font-size: 14px;
                height: 45px;
            }

            .btn-rele.activo {
                background-color: #00bcd4;
                color: black;
            }

            .btn:active {
                opacity: 0.8;
            }

            #timer-label {
                font-size: 16px;
                color: #ffeb3b;
                font-weight: bold;
                margin-top: 8px;
                height: 20px;
            }

            #queue-label {
                font-size: 12px;
                color: #aaaaaa;
            }

            .seccion-titulo {
                font-size: 12px;
                color: #ffffff;
                text-align: left;
                margin: 2px 0 5px 5px;
                font-weight: bold;
            }

            #msg-error {
                color: #ff3333;
                font-weight: bold;
                display: none;
                margin-bottom: 10px;
            }
        </style>
    </head>
    <body>
        <h1>CONTROL MAESTRO</h1>
        <h3>Ecosistema IoT Multi-Proposito</h3>
        <div id="msg-error">FALTA EL TOKEN EN LA URL (?key=...)</div>
        <div class="select-container">
            <strong>MODO DE OPERACION: </strong>
            <select id="selector-modo" onchange="cambiarModoEstrategico()">
                <option value="continuo_seguro">Continuo Seguro (Monopatin)</option>
                <option value="continuo_fijo">Continuo Fijo (Motores General)</option>
                <option value="pasos">Modo Por Pasos Cronometrados</option>
            </select>
        </div>
        <div class="panel">
            <div class="seccion-titulo">SISTEMA DE MOTORES GESTION:</div>
            <div style="display: flex; gap: 6px; justify-content: center;">
                <button class="btn" style="width:55px;" id="btn-I" onpointerdown="gestionarPresion('direccion','I')"
                    onpointerup="gestionarLiberacion('direccion','I')"
                    onpointerleave="gestionarLiberacion('direccion','I')">I</button>
                <button class="btn" style="width:55px;" id="btn-A" onpointerdown="gestionarPresion('traccion','A')"
                    onpointerup="gestionarLiberacion('traccion','A')"
                    onpointerleave="gestionarLiberacion('traccion','A')">A</button>
                <button class="btn" style="width:55px;" id="btn-R" onpointerdown="gestionarPresion('traccion','R')"
                    onpointerup="gestionarLiberacion('traccion','R')"
                    onpointerleave="gestionarLiberacion('traccion','R')">R</button>
                <button class="btn" style="width:55px;" id="btn-D" onpointerdown="gestionarPresion('direccion','D')"
                    onpointerup="gestionarLiberacion('direccion','D')"
                    onpointerleave="gestionarLiberacion('direccion','D')">D</button>
            </div>
            <button class="btn btn-stop" id="btn-P" onclick="enviarStopFuerte()">STOP GENERAL / EMERGENCIAS</button>
            <div id="timer-label">Sistema Listo</div>
            <div id="queue-label">Fila de espera: 0 comandos</div>
        </div>
        <br>
        <div class="panel panel-reles">
            <div class="seccion-titulo">MODULO DE ACTUADORES RELE:</div>
            <div class="grid-reles">
                <button class="btn btn-rele" id="r0" onclick="conmutarRele(0)">R1</button>
                <button class="btn btn-rele" id="r1" onclick="conmutarRele(1)">R2</button>
                <button class="btn btn-rele" id="r2" onclick="conmutarRele(2)">R3</button>
                <button class="btn btn-rele" id="r3" onclick="conmutarRele(3)">R4</button>
                <button class="btn btn-rele" id="r4" onclick="conmutarRele(4)">R5</button>
                <button class="btn btn-rele" id="r5" onclick="conmutarRele(5)">R6</button>
                <button class="btn btn-rele" id="r6" onclick="conmutarRele(6)">R7</button>
                <button class="btn btn-rele" id="r7" onclick="conmutarRele(7)">R8</button>
            </div>
        </div>
        <script>
            const fb_url = "https://control-motor-b04c1-default-rtdb.firebaseio.com/";
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('key');

            //Tiempos de inicio separados e independientes para evitar cruces
            let tiempoInicioA = 0;
            let tiempoInicioD = 0;

            let modoSeleccionado = "continuo_seguro";
            let filaComandos = [];
            let procesandoFila = false;
            let estadoReles = ["0", "0", "0", "0", "0", "0", "0", "0"];
            let estadosMotores = { traccion: 'P', direccion: 'P' };

            if (!token) {
                document.getElementById("msg-error").style.display = "block";
            } else {
                setInterval(() => {
                    fetch(`${fb_url}reles.json?auth=${token}`)
                        .then(r => r.json())
                        .then(data => { if (data && data.length === 8) { estadoReles = data.split(""); actualizarBotonesReles(); } });

                    if (modoSeleccionado === "continuo_fijo") {
                        fetch(`${fb_url}traccion.json?auth=${token}`).then(r => r.json()).then(t => { estadosMotores.traccion = t; actualizarColoresMotores(); });
                        fetch(`${fb_url}direccion.json?auth=${token}`).then(r => r.json()).then(d => { estadosMotores.direccion = d; actualizarColoresMotores(); });
                    }
                }, 500);
            }

            function cambiarModoEstrategico() {
                if (!token) return;
                modoSeleccionado = document.getElementById("selector-modo").value;
                fetch(`${fb_url}modo_operacion.json?auth=${token}`, { method: 'PUT', body: JSON.stringify(modoSeleccionado) });
                enviarStopFuerte();
            }

            function gestionarPresion(nodo, valor) {
                if (!token) return;

                //Evitamos re-disparar el cronometro si el boton ya esta activo
                if (nodo === 'traccion' && estadosMotores.traccion === valor) return;
                if (nodo === 'direccion' && estadosMotores.direccion === valor) return;

                if (nodo === 'traccion') {
                    tiempoInicioA = performance.now();
                    estadosMotores.traccion = valor;
                } else {
                    tiempoInicioD = performance.now();
                    estadosMotores.direccion = valor;
                }

                actualizarEtiquetaTexto();
                actualizarColoresMotores();

                if (modoSeleccionado === "continuo_seguro" || modoSeleccionado === "continuo_fijo") {
                    enviarFBRapido(nodo, valor);
                }
            }

            function gestionarLiberacion(nodo, valor) {
                if (!token) return;

                //Verificacion estricta: Solo procesa si soltamos el boton que realmente estaba activo
                if (nodo === 'traccion' && estadosMotores.traccion !== valor) return;
                if (nodo === 'direccion' && estadosMotores.direccion !== valor) return;

                let tiempoFin = performance.now();
                let duracionMs = 0;

                if (nodo === 'traccion') {
                    duracionMs = Math.round(tiempoFin - tiempoInicioA);
                    estadosMotores.traccion = 'P';
                } else {
                    duracionMs = Math.round(tiempoFin - tiempoInicioD);
                    estadosMotores.direccion = 'P';
                }

                if (modoSeleccionado === "continuo_seguro") {
                    actualizarColoresMotores();
                    actualizarEtiquetaTexto();
                    enviarFBRapido(nodo, "P");
                }
                else if (modoSeleccionado === "pasos") {
                    actualizarColoresMotores();
                    document.getElementById("timer-label").innerText = `Ultimo toque [${valor}]: ${(duracionMs / 1000).toFixed(2)}s`;
                    filaComandos.push(`${valor}:${duracionMs}`);
                    actualizarInterfazFila();
                    procesarSiguienteEnFila();
                }
            }

            //Funcion limpia para actualizar el mensaje en pantalla
            function actualizarEtiquetaTexto() {
                let msg = "";
                if (estadosMotores.traccion === 'A') msg = "Marchando: ADELANTE";
                if (estadosMotores.traccion === 'R') msg = "Marchando: REVERSA";
                if (estadosMotores.direccion === 'I') msg = msg ? msg + " + IZQUIERDA" : "GIRANDO: IZQUIERDA";
                if (estadosMotores.direccion === 'D') msg = msg ? msg + " + DERECHA" : "GIRANDO: DERECHA";
                document.getElementById("timer-label").innerText = msg ? msg + "..." : "Sistema Listo";
            }

            function actualizarColoresMotores() {
                document.getElementById("btn-A").classList.toggle("activo-motor", estadosMotores.traccion === 'A');
                document.getElementById("btn-R").classList.toggle("activo-motor", estadosMotores.traccion === 'R');
                document.getElementById("btn-I").classList.toggle("activo-motor", estadosMotores.direccion === 'I');
                document.getElementById("btn-D").classList.toggle("activo-motor", estadosMotores.direccion === 'D');
            }

            function conmutarRele(idx) {
                if (!token) return;
                estadoReles[idx] = (estadoReles[idx] === "0") ? "1" : "0";
                actualizarBotonesReles();
                enviarFBRapido("reles", estadoReles.join(""));
            }

            function actualizarBotonesReles() {
                for (let i = 0; i < 8; i++) {
                    let btn = document.getElementById(`r${i}`);
                    if (estadoReles[i] === "1") btn.classList.add("activo");
                    else btn.classList.remove("activo");
                }
            }

            function procesarSiguienteEnFila() {
                if (!token || procesandoFila || filaComandos.length === 0) return;
                procesandoFila = true;
                fetch(`${fb_url}comando_paso.json?auth=${token}`).then(res => res.json()).then(data => {
                    if (data === "P") {
                        let siguiente = filaComandos.shift();
                        actualizarInterfazFila();
                        fetch(`${fb_url}comando_paso.json?auth=${token}`, { method: 'PUT', body: JSON.stringify(siguiente) })
                            .then(() => {
                                const intervalo = setInterval(() => {
                                    fetch(`${fb_url}comando_paso.json?auth=${token}`).then(res => res.json()).then(data => {
                                        if (data === "P") { clearInterval(intervalo); procesandoFila = false; procesarSiguienteEnFila(); }
                                    });
                                }, 80);
                            });
                    } else { procesandoFila = false; setTimeout(procesarSiguienteEnFila, 400); }
                });
            }

            function actualizarInterfazFila() {
                document.getElementById("queue-label").innerText = `Fila de espera: ${filaComandos.length} comandos`;
            }

            function enviarFBRapido(nodo, valor) {
                if (!token) return;
                fetch(`${fb_url}${nodo}.json?auth=${token}`, { method: 'PUT', body: JSON.stringify(valor) });
            }

            function enviarStopFuerte() {
                if (!token) return;
                filaComandos = []; actualizarInterfazFila();
                estadosMotores = { traccion: 'P', direccion: 'P' };
                actualizarColoresMotores();
                enviarFBRapido("comando_paso", "P");
                enviarFBRapido("traccion", "P");
                enviarFBRapido("direccion", "P");
                document.getElementById("timer-label").innerText = "SISTEMA DETENIDO / TODO A CERO";
            }
        </script>
    </body>
</html>
